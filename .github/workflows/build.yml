
name: Compilar widget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Descomprimir proyecto
        shell: pwsh
        run: |
          Expand-Archive -Path YouTubeGameBar.zip -DestinationPath src

      - name: Crear certificado de firma
        shell: pwsh
        run: |
          $projectDir = "src\YouTubeGameBar\YouTubeGameBar"

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=YouTubeGameBar" `
            -KeyUsage DigitalSignature -FriendlyName "YouTubeGameBar" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}") `
            -NotAfter (Get-Date).AddYears(3)

          $pwd = ConvertTo-SecureString -String "1234" -Force -AsPlainText

          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "$projectDir\YouTubeGameBar.pfx" `
            -Password $pwd

          Export-Certificate -Cert $cert -FilePath "YouTubeGameBar.cer"

      - name: Compilar solución
        shell: pwsh
        run: |
          msbuild src\YouTubeGameBar\YouTubeGameBar.sln `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\src\YouTubeGameBar\YouTubeGameBar\YouTubeGameBar.pfx" `
            /p:PackageCertificatePassword=1234 `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeGameBar
          path: |
            out/**
            YouTubeGameBar.cer

